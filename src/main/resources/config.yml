# 服务器唯一标识符，用于验证码前缀
# 每个服务器必须设置不同的ID
# 警告：使用默认值会导致多服务器验证码冲突！
server-id: "default"

# WebSocket 配置 (用于双向聊天)
websocket:
  enabled: false
  port: 25580

# 自定义提示消息
messages:
  # 玩家加入时未绑定的提示
  not-bound: "&c您的账号未绑定QQ，已被限制移动！"
  # 提示玩家使用/link
  use-link: "&a请输入指令 /link 获取验证码"
  # 验证码生成成功
  code-generated: "&a验证码: &b{code} &7(请发给机器人: 绑定 {code})"
  # 已验证无需重复
  already-verified: "&a无需重复验证。"
  # 验证成功
  verify-success: "&a【系统】验证成功/绑定信息已更新，限制解除！"
