# Server ID used as the verification-code prefix.
# Give every server a unique ID in multi-server setups.
server-id: "default"

# Set enabled to false to disable QQ account verification and keep
# only WebSocket bidirectional chat.
auth:
  enabled: true

# WebSocket settings for bidirectional chat.
websocket:
  enabled: false
  port: 25580

messages:
  not-bound: "&c您的账号未绑定QQ，已被限制移动！"
  use-link: "&a请输入指令 /link 获取验证码"
  code-generated: "&a验证码: &b{code} &7(请发给机器人: 绑定 {code})"
  already-verified: "&a无需重复验证。"
  verify-success: "&a【系统】验证成功/绑定信息已更新，限制解除！"
